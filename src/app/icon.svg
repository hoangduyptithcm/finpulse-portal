<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Premium Midnight to Deep Royal Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Vibrant Pulse Gradient: Electric Cyan to Emerald Neon -->
    <linearGradient id="pulseGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Glowing effect -->
    <filter id="pulseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Modern Squircle Base -->
  <rect width="128" height="128" rx="30" fill="url(#bgGrad)" />

  <!-- Subtle border highlight -->
  <rect width="124" height="124" x="2" y="2" rx="28" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Subtle finance grid background lines -->
  <line x1="22" y1="46" x2="106" y2="46" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="22" y1="64" x2="106" y2="64" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="22" y1="82" x2="106" y2="82" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Pulse Wave Shadow/Glow (Soft halo) -->
  <path d="M 20 72 L 40 72 L 49 52 L 60 90 L 73 34 L 84 72 L 93 54 L 108 36"
        fill="none" stroke="#10B981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.25" filter="url(#pulseGlow)" />

  <!-- Main FinPulse Dynamic Line -->
  <path d="M 20 72 L 40 72 L 49 52 L 60 90 L 73 34 L 84 72 L 93 54 L 108 36"
        fill="none" stroke="url(#pulseGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Glowing Peak Node with Growth Arrow -->
  <circle cx="108" cy="36" r="6" fill="#34D399" />
  <circle cx="108" cy="36" r="3.5" fill="#FFFFFF" />
  <path d="M 103 25 L 115 32 L 107 42 Z" fill="#34D399" />
</svg>
